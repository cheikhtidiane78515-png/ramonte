<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>100% Ramonté — Plateforme de jeu</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#111f4a;--navy2:#34406a;--cy:#5fe0ff;--bl:#1478ff;--gr:#35c93a;--rd:#e8433f;--gold:#ffd23f;--bg:#f3f5fa;--ink:#111f4a}
body{font-family:Inter,"Trebuchet MS",Verdana,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
button{font:inherit;cursor:pointer}
/* barre du haut */
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e3e7f1;height:56px;display:flex;align-items:center;gap:10px;padding:0 12px}
.top .burger{border:0;background:none;font-size:26px;color:var(--ink);padding:4px 8px}
.top .ttl{font-weight:800;font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .who{font-size:13px;color:#555;white-space:nowrap}
.top .out{border:0;background:none;font-size:20px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:#999}
.dot.on{background:var(--gr)}.dot.off{background:var(--rd)}
/* tiroir */
.back{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;opacity:0;pointer-events:none;transition:.2s}
.back.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:78%;max-width:320px;background:var(--navy);color:#fff;z-index:31;transform:translateX(-102%);transition:.22s;padding:18px 14px;overflow-y:auto}
.drawer.on{transform:none}
.drawer .hd{display:flex;align-items:center;justify-content:space-between;padding:6px 6px 22px}
.drawer .hd b{font-size:21px;letter-spacing:.5px}
.drawer .hd button{background:none;border:0;color:#fff;font-size:26px}
.drawer .it{display:flex;align-items:center;gap:16px;width:100%;border:0;background:none;color:#fff;text-align:left;padding:15px 14px;border-radius:12px;font-size:17px;margin-bottom:2px}
.drawer .it.on{background:var(--navy2)}
.drawer .it i{font-style:normal;width:26px;text-align:center;font-size:20px}
main{max-width:960px;margin:0 auto;padding:14px 12px 60px}
/* cartes admin */
.card{background:#fff;border:1px solid #e3e7f1;border-radius:14px;padding:14px;margin-bottom:12px}
h1{font-size:22px;margin-bottom:12px}
h2{font-size:17px;margin-bottom:10px}
.sub{font-size:13px;color:#6a7390}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:#fff;border:1px solid #e3e7f1;border-radius:14px;padding:14px}
.stat b{display:block;font-size:28px}
.stat span{font-size:12px;color:#6a7390}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;font-size:15px;color:#fff;background:var(--navy)}
.btn.g{background:#1f9a3a}.btn.r{background:#c92f2b}.btn.y{background:#e0a800;color:#3a2a00}.btn.l{background:#e8ecf7;color:var(--ink)}
.btn.s{padding:6px 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.4}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{justify-content:space-between}
input,select,textarea{width:100%;border:1px solid #cfd6e8;border-radius:10px;padding:10px;font:inherit;font-size:15px;background:#fff;color:var(--ink)}
textarea{min-height:120px;resize:vertical}
label{display:block;font-size:12px;font-weight:700;color:#6a7390;margin:10px 0 4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.item{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #eef0f6}
.item:last-child{border:0}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .tx small{color:#6a7390}
.tag{font-size:11px;border-radius:12px;padding:3px 9px;background:#e8ecf7;font-weight:700;white-space:nowrap}
.tag.in{background:#d9f4de;color:#176b2a}.tag.out{background:#fbe0df;color:#8e2420}.tag.y{background:#fff0bf;color:#6b4d00}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 6px;text-align:left;border-bottom:1px solid #eef0f6}
th{font-size:11px;text-transform:uppercase;color:#6a7390}
.num{text-align:center}
tr.top3 td:first-child{color:#c88a00;font-weight:900}
.phasebar{display:flex;gap:6px;margin-bottom:12px}
.phasebar div{flex:1;text-align:center;padding:8px 2px;border-radius:10px;background:#e8ecf7;font-size:12px;font-weight:700}
.phasebar div.on{background:var(--navy);color:#fff}.phasebar div.ok{background:#d9f4de;color:#176b2a}
.match{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #eef0f6;flex-wrap:wrap}
.match .n{width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px}
.match .pl{flex:1;min-width:90px;font-weight:600}
.match .pl.w{color:#1f9a3a;font-weight:900}
.match .sc{font-weight:900}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;z-index:50;font-size:14px;max-width:90%}
.empty{text-align:center;color:#6a7390;padding:20px}
/* écran TV */
.tv{border-radius:18px;padding:12px;color:#fff;background:radial-gradient(circle at 20% 10%,#2d7bff 0,transparent 45%),linear-gradient(180deg,#0b2bc4,#0a1d8f);position:relative;overflow:hidden;margin-bottom:12px}
.tv:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.75;background-image:radial-gradient(2px 2px at 10% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 30% 70%,#cfe8ff,transparent),radial-gradient(2px 2px at 55% 35%,#fff,transparent),radial-gradient(1.5px 1.5px at 75% 15%,#fff,transparent),radial-gradient(2px 2px at 90% 60%,#cfe8ff,transparent);background-size:360px 360px}
.tv>*{position:relative}
.tv .lg{text-align:center;font-weight:900;font-size:20px;margin-bottom:2px}.tv .lg b{color:var(--gold)}
.tv .ph{text-align:center;font-size:12px;opacity:.9;margin-bottom:8px}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative}
.pan{border:3px solid var(--cy);border-radius:14px;min-height:170px;padding:10px;text-align:center;position:relative;overflow:hidden;background:linear-gradient(180deg,#ffb23a,#ff8a1f 55%,#7ccb3a)}
.pan.p2{background:linear-gradient(180deg,#ffd23f,#ffa51f 60%,#ff7a1f)}
.pan.act{box-shadow:0 0 0 4px var(--gold),0 0 24px var(--gold)}
.pan .nm{display:inline-block;background:rgba(6,35,143,.9);border-radius:10px;padding:5px 10px;font-weight:900;font-size:16px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pan .pt{font-size:50px;font-weight:900;text-shadow:0 4px 0 rgba(0,0,0,.35);margin-top:12px}
.pan .lb{font-size:11px;font-weight:800;color:#06238f;background:rgba(255,255,255,.8);border-radius:8px;padding:2px 8px}
.pan .st{position:absolute;right:8px;bottom:4px;font-size:28px}
.timer{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:70px;height:70px;border-radius:50%;background:#06238f;border:4px solid var(--cy);display:grid;place-items:center;font-size:30px;font-weight:900;z-index:2}
.timer.low{border-color:var(--rd);color:#ff9b97}
.qinfo{font-size:12px;text-align:center;margin-top:10px;opacity:.9}
.qbar{margin-top:10px;background:rgba(10,40,160,.92);border:2px solid var(--cy);border-radius:12px;padding:16px 10px;text-align:center;font-size:18px;font-weight:700;line-height:1.35}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.ans button{padding:14px 6px;font-size:17px;font-weight:800;color:#fff;border-radius:26px;border:3px solid #fff;background:linear-gradient(#2a8cff,#0e62dc)}
.ans button.ok{background:linear-gradient(#58e05c,#1f9a25)}.ans button.ko{background:linear-gradient(#ff6a66,#b82723)}.ans button.dim{opacity:.45}
.banner{text-align:center;padding:12px;font-size:19px;font-weight:900;color:var(--gold)}
.tv .btn{border:2px solid #bfe9ff;background:linear-gradient(#2a8cff,#0e62dc)}
.tv .btn.g{background:linear-gradient(#58e05c,#27a82c)}.tv .btn.r{background:linear-gradient(#ff6a66,#c92f2b)}
@media(max-width:520px){.pan .pt{font-size:40px}.qbar{font-size:15px}.ans button{font-size:14px}}
</style>
</head>
<body>
<div class="top">
  <button class="burger" data-act="menu" aria-label="Menu">☰</button>
  <div class="ttl" id="ttl">100% Ramonté</div>
  <div class="who" id="who"></div>
  <button class="out" data-go="mdp" title="Accès administrateur">⎋</button>
</div>
<div class="back" id="back" data-act="menu"></div>
<aside class="drawer" id="drawer"></aside>
<main id="app"></main>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const PH=["Préliminaires","Huitièmes","Quarts de finale"];
const BK=[
[["Quelle est la capitale du Sénégal ?","Dakar","Saint-Louis","A"],["Quel est le plus grand océan du monde ?","L'Atlantique","Le Pacifique","B"],["Dans la légende du roi Arthur, sous quel nom connaît-on mieux la fée Viviane ?","La Dame à la licorne","La Dame du lac","B"],["Combien de jours compte février lors d'une année bissextile ?","28","29","B"],["Quelle planète est la plus proche du Soleil ?","Mercure","Vénus","A"],["Qui a peint la Joconde ?","Léonard de Vinci","Michel-Ange","A"],["Quelle monnaie est utilisée au Sénégal ?","Le franc CFA","Le dirham","A"],["Combien de joueurs d'une équipe sont sur le terrain au football ?","11","9","A"],["Combien y a-t-il de jours dans une semaine ?","7","8","A"],["Quel animal est surnommé le roi de la savane ?","Le lion","L'éléphant","A"]],
[["Quel est le plus long fleuve d'Afrique ?","Le Nil","Le Congo","A"],["Qui fut le premier président du Sénégal ?","Léopold Sédar Senghor","Abdou Diouf","A"],["Quel est le symbole chimique de l'or ?","Ag","Au","B"],["En quelle année l'Homme a-t-il marché sur la Lune ?","1969","1975","A"],["Quel pays a remporté la Coupe du monde de football en 2018 ?","La France","La Croatie","A"],["Quel est le plus grand désert chaud du monde ?","Le Sahara","Le Gobi","A"],["Combien d'os compte le corps humain adulte ?","206","306","A"],["Qui a écrit « Les Misérables » ?","Victor Hugo","Émile Zola","A"],["Quel est le plus grand mammifère terrestre ?","L'éléphant d'Afrique","Le rhinocéros","A"],["Quelle est la capitale du Mali ?","Bamako","Niamey","A"]],
[["Quelle est la capitale de l'Australie ?","Sydney","Canberra","B"],["Quelle est la racine carrée de 144 ?","12","14","A"],["Quel gaz est le plus abondant dans l'atmosphère terrestre ?","L'oxygène","L'azote","B"],["En quelle année a eu lieu la prise de la Bastille ?","1789","1792","A"],["Quel est le plus petit État du monde ?","Monaco","Le Vatican","B"],["Qui a écrit « Une si longue lettre » ?","Mariama Bâ","Aminata Sow Fall","A"],["À quelle température l'eau bout-elle au niveau de la mer ?","90 °C","100 °C","B"],["Quel pays a pour capitale Ouagadougou ?","Le Burkina Faso","Le Mali","A"],["Combien de côtés a un hexagone ?","6","8","A"],["Quel est le plus haut sommet d'Afrique ?","Le Kilimandjaro","Le mont Kenya","A"]]];
const fresh=()=>({names:Array.from({length:32},(_,i)=>"Candidat "+(i+1)),
 set:{secs:15,qpm:6,pts:[10,15,20]},
 banks:BK.map(b=>b.map(r=>({q:r[0],a:r[1],b:r[2],c:r[3]==="B"?1:0}))),
 phase:0,qualified:null,matches:[[],[],[]],drawn:[false,false,false],used:[[],[],[]],out:{},final:false,log:[],cur:null,pin:""});

let S=fresh(),UI={tab:"dash",menu:false,search:"",addC:false,editC:null,editQ:null,qp:0,tmsg:""};
let unlocked=false,readOnly=false,tmr=null,left=0,paused=false,conn="local",lastJson="",wt=null,db=null,ref=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nm=i=>i==null?"—":esc(S.names[i]??"?");
const A=()=>sb?!!session:true;
const qual=()=>S.qualified||S.names.map((_,i)=>i);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const toast=t=>{const e=$("toast");e.innerHTML=`<div class="toast">${esc(t)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>e.innerHTML="",2600);};

/* ---------- persistance Supabase (temps réel) ---------- */
const CFG=window.RAMONTE_CONFIG||{};
let sb=null,session=null,lastWrite=0;
if(window.supabase&&CFG.SUPABASE_URL&&!/VOTRE/.test(CFG.SUPABASE_URL)){try{sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);}catch(e){}}
const canon=o=>JSON.stringify(o,(k,v)=>v&&typeof v==="object"&&!Array.isArray(v)?Object.keys(v).sort().reduce((r,x)=>(r[x]=v[x],r),{}):v);
if(!sb){try{const r=localStorage.getItem("ramonte_v2");if(r)S=Object.assign(fresh(),JSON.parse(r));}catch(e){}}
function commit(){
  lastJson=canon(S);lastWrite=Date.now();
  if(!sb){try{localStorage.setItem("ramonte_v2",JSON.stringify(S));}catch(e){}}
  else if(session){clearTimeout(wt);wt=setTimeout(async()=>{lastWrite=Date.now();
    const {error}=await sb.from("game_state").upsert({id:1,data:S,updated_at:new Date().toISOString()});
    if(error){conn="ro";toast("Enregistrement refusé : "+error.message);}else conn="live";render();},350);}
  render();
}
function applyRemote(o){
  if(!o)return;const j=canon(o);if(j===lastJson)return;
  if(session&&Date.now()-lastWrite<2500)return;
  S=Object.assign(fresh(),o);lastJson=j;render();
}
(async()=>{
  if(!sb){conn="local";render();return;}
  conn="live";
  try{
    const r=await sb.auth.getSession();session=r.data.session;
    sb.auth.onAuthStateChange((_e,s)=>{session=s;render();});
    const {data}=await sb.from("game_state").select("data").eq("id",1).maybeSingle();
    if(data&&data.data)applyRemote(data.data);
    sb.channel("gs").on("postgres_changes",{event:"*",schema:"public",table:"game_state"},p=>{if(p.new&&p.new.data)applyRemote(p.new.data);}).subscribe();
  }catch(e){conn="ro";}
  render();
})();
async function doLogin(){
  const {error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
  if(error)toast("Connexion refusée : "+error.message);else{toast("Connecté");UI.tab="dash";}render();
}
async function doLogout(){await sb.auth.signOut();session=null;toast("Déconnecté");render();}
async function doChangePw(){
  const v=$("npw").value;if(v.length<8){toast("Minimum 8 caractères");return;}
  const {error}=await sb.auth.updateUser({password:v});toast(error?error.message:"Mot de passe changé");
}

/* ---------- logique du jeu ---------- */
const matchesAll=()=>S.matches.flatMap((ms,p)=>ms.map((m,i)=>({m,p,i})));
function totals(){const t={};matchesAll().forEach(({m})=>{t[m.a]=(t[m.a]||0)+m.sa;if(m.b!=null)t[m.b]=(t[m.b]||0)+m.sb;});return t;}
function wins(){const w={};matchesAll().forEach(({m})=>{if(m.done&&m.w!=null)w[m.w]=(w[m.w]||0)+1;});return w;}
const started=()=>S.drawn.some(Boolean);
function draw(){
  const p=S.phase,ids=shuffle(qual()),ms=[];
  for(let i=0;i<ids.length;i+=2){
    if(i+1<ids.length)ms.push({a:ids[i],b:ids[i+1],sa:0,sb:0,done:false,w:null});
    else ms.push({a:ids[i],b:null,sa:0,sb:0,done:true,w:ids[i],bye:true});
  }
  S.matches[p]=ms;S.drawn[p]=true;S.cur=null;commit();
}
const phaseDone=()=>S.drawn[S.phase]&&S.matches[S.phase].length>0&&S.matches[S.phase].every(m=>m.done);
function nextPhase(){
  const p=S.phase,ms=S.matches[p];
  ms.forEach(m=>[m.a,m.b].forEach(x=>{if(x!=null&&x!==m.w)S.out[x]=p;}));
  S.qualified=ms.map(m=>m.w);
  if(p<2)S.phase=p+1;else S.final=true;
  commit();
}
function pickQ(p,n){
  const bank=S.banks[p];let pool=bank.map((_,i)=>i).filter(i=>!S.used[p].includes(i));
  if(pool.length<n){S.used[p]=[];pool=bank.map((_,i)=>i);}
  const ids=shuffle(pool).slice(0,n);S.used[p].push(...ids);return ids.map(i=>bank[i]);
}
function startMatch(mi){
  const p=S.phase,m=S.matches[p][mi];
  if(!S.banks[p].length){toast("Ajoutez d'abord des questions pour cette phase.");return;}
  m.sa=0;m.sb=0;m.done=false;m.w=null;
  S.log=S.log.filter(l=>!(l.p===p&&l.mi===mi));
  S.cur={p,mi,qi:0,qs:pickQ(p,S.set.qpm),ans:false,pick:-1,msg:"",over:false};
  UI.tab="match";startTimer();commit();
}
function startTimer(){
  clearInterval(tmr);left=S.set.secs;paused=false;
  tmr=setInterval(()=>{
    if(paused||!S.cur||S.cur.ans||S.cur.over||!A())return;
    left--;const el=$("tm");if(el){el.textContent=Math.max(left,0);el.classList.toggle("low",left<=5);}
    if(left<=0)answer(-1);
  },1000);
}
function answer(idx){
  const c=S.cur;if(!c||c.ans||!A())return;
  const m=S.matches[c.p][c.mi],q=c.qs[c.qi],ok=idx===q.c,who=c.qi%2===0?"a":"b";
  c.ans=true;c.pick=idx;
  if(ok){if(who==="a")m.sa+=S.set.pts[c.p];else m.sb+=S.set.pts[c.p];}
  S.log.push({p:c.p,mi:c.mi,id:m[who],ok,to:idx===-1});
  c.msg=idx===-1?"Temps écoulé !":ok?"Bonne réponse ! +"+S.set.pts[c.p]+" pts":"Mauvaise réponse";
  commit();
}
function nextQ(){
  const c=S.cur,m=S.matches[c.p][c.mi];c.qi++;
  if(c.qi>=c.qs.length){
    if(m.sa===m.sb){c.qs.push(...pickQ(c.p,2));}
    else{m.done=true;m.w=m.sa>m.sb?m.a:m.b;c.over=true;clearInterval(tmr);commit();return;}
  }
  c.ans=false;c.pick=-1;c.msg="";startTimer();commit();
}

/* ---------- vues ---------- */
const MENU=[["dash","▦","Tableau de bord"],["cands","👥","Candidats"],["tirage","🎲","Tirage & matchs"],["match","🎯","Match en direct"],["classement","🏆","Classement"],["questions","📝","Questions"],["rapports","📄","Rapports"],["reglages","⚙","Réglages"],["mdp","🔑","Mon compte"]];
const phaseBar=()=>`<div class="phasebar">${PH.map((l,i)=>`<div class="${i===S.phase&&!S.final?"on":""} ${i<S.phase||(S.final)?"ok":""}">${l}</div>`).join("")}</div>`;
function vDash(){
  const ms=matchesAll().filter(x=>!x.m.bye),done=ms.filter(x=>x.m.done).length;
  const t=totals(),w=wins();
  const top=S.names.map((n,i)=>({i,p:t[i]||0,w:w[i]||0})).sort((a,b)=>b.p-a.p||b.w-a.w).slice(0,3);
  const next=S.drawn[S.phase]?S.matches[S.phase].map((m,i)=>({m,i})).filter(x=>!x.m.done).slice(0,3):[];
  return `<h1>Tableau de bord</h1>
  <div class="stats"><div class="stat"><b>${S.names.length}</b><span>Candidats inscrits</span></div><div class="stat"><b>${S.final?"—":qual().length}</b><span>${S.final?"Concours terminé":"En lice"}</span></div>
  <div class="stat"><b>${done}</b><span>Matchs joués (sur ${ms.length} tirés)</span></div><div class="stat"><b>${S.final?"Fin":PH[S.phase]}</b><span>Phase actuelle</span></div></div>
  <div class="card">${phaseBar()}
  ${A()?`<div class="row"><button class="btn" data-go="tirage">🎲 Tirage & matchs</button><button class="btn l" data-go="match">🎯 Match en direct</button></div>`:`<div class="sub">Mode spectateur : suivez le jeu en direct.</div>`}</div>
  ${S.cur&&!S.cur.over?`<div class="card"><b>🔴 Match en cours</b> : ${nm(S.matches[S.cur.p][S.cur.mi].a)} contre ${nm(S.matches[S.cur.p][S.cur.mi].b)} <button class="btn s" data-go="match" style="margin-left:8px">Voir</button></div>`:""}
  <div class="card"><h2>Podium provisoire</h2>${top.some(x=>x.p>0)?top.map((x,k)=>`<div class="item"><b>${["🥇","🥈","🥉"][k]}</b><div class="tx"><b>${nm(x.i)}</b></div><span class="tag y">${x.p} pts</span></div>`).join(""):`<div class="empty">Aucun point pour le moment.</div>`}</div>
  ${next.length?`<div class="card"><h2>Prochains matchs</h2>${next.map(x=>`<div class="item"><span class="tag">#${x.i+1}</span><div class="tx"><b>${nm(x.m.a)} vs ${nm(x.m.b)}</b></div></div>`).join("")}</div>`:""}`;
}
function vCands(){
  const q=UI.search.toLowerCase(),t=totals(),inQ=new Set(qual());
  const list=S.names.map((n,i)=>({n,i})).filter(x=>x.n.toLowerCase().includes(q));
  const lock=started();
  return `<div class="row sp" style="margin-bottom:12px"><h1 style="margin:0">Candidats</h1>${A()&&!lock?`<button class="btn" data-act="addc">＋ Ajouter</button>`:""}</div>
  ${UI.addC&&A()&&!lock?`<div class="card"><label>Nom du candidat</label><input id="newc" placeholder="Nom complet"><div class="row" style="margin-top:10px"><button class="btn g" data-act="savenew">Enregistrer</button><button class="btn l" data-act="addc">Annuler</button></div></div>`:""}
  <div class="card"><input id="srch" placeholder="🔍 Rechercher un candidat" value="${esc(UI.search)}">
  ${lock&&A()?`<div class="sub" style="margin-top:8px">Le tirage a commencé : vous pouvez renommer les candidats, mais plus en ajouter ou en retirer.</div>`:""}</div>
  <div class="card">${list.length?list.map(({n,i})=>`<div class="item">
   <div class="tx">${UI.editC===i&&A()?`<input id="ec" value="${esc(n)}">`:`<b>${esc(n)}</b><small>${t[i]||0} pts</small>`}</div>
   ${S.out[i]!=null?`<span class="tag out">éliminé</span>`:S.final&&inQ.has(i)?`<span class="tag y">qualifié</span>`:inQ.has(i)?`<span class="tag in">en lice</span>`:""}
   ${A()?(UI.editC===i?`<button class="btn s g" data-act="savec" data-i="${i}">OK</button>`:`<button class="btn s l" data-act="editc" data-i="${i}">✏</button>${lock?"":`<button class="btn s r" data-act="delc" data-i="${i}">🗑</button>`}`):""}</div>`).join(""):`<div class="empty">Aucun candidat.</div>`}</div>
  ${A()&&!lock?`<div class="card"><h2>Importer une liste</h2><textarea id="bulk" placeholder="Un nom par ligne"></textarea><div style="margin-top:8px"><button class="btn" data-act="bulk">Ajouter ces noms</button></div></div>`:""}`;
}
function vTirage(){
  const p=S.phase,ms=S.matches[p];let h=`<h1>Tirage & matchs</h1><div class="card">${phaseBar()}<h2>${S.final?"Concours terminé":PH[p]}</h2>`;
  if(S.final){h+=`<div class="sub">Qualifiés à l'issue des quarts de finale :</div>${qual().map(i=>`<div class="item"><b>🏅 ${nm(i)}</b></div>`).join("")}</div>`;return h;}
  if(!S.drawn[p]){
    h+=`<p class="sub">${qual().length} candidats à répartir en ${Math.ceil(qual().length/2)} match(s).</p>${A()?`<div style="margin-top:12px"><button class="btn g" data-act="draw">🎲 Lancer le tirage au sort</button></div>`:""}</div>`;return h;
  }
  h+=ms.map((m,i)=>`<div class="match"><span class="n">${i+1}</span><span class="pl ${m.w===m.a&&m.done?"w":""}">${nm(m.a)}</span>
   ${m.bye?`<span class="tag">qualifié d'office</span>`:`<span class="sc">${m.done?m.sa+" – "+m.sb:"VS"}</span><span class="pl ${m.w===m.b&&m.done?"w":""}" style="text-align:right">${nm(m.b)}</span>`}
   ${A()&&!m.bye?`<span class="row">${!m.done?`<button class="btn s g" data-play="${i}">Jouer</button><button class="btn s l" data-win="${i}" data-s="a" title="Forfait / vainqueur : 1er">1er gagne</button><button class="btn s l" data-win="${i}" data-s="b">2e gagne</button>`:`<span class="tag in">terminé</span><button class="btn s l" data-reset="${i}" title="Rejouer">↺</button>`}</span>`:""}</div>`).join("");
  h+=`</div>`;
  if(A()){h+=`<div class="row">`;
   if(phaseDone())h+=`<button class="btn y" data-act="next">${p<2?"➡ Passer aux "+PH[p+1]:"✓ Valider les qualifiés des quarts"}</button>`;
   if(!ms.some(m=>m.done&&!m.bye))h+=`<button class="btn l" data-act="draw">🔁 Refaire le tirage</button>`;h+=`</div>`;}
  return h;
}
function vMatch(){
  const c=S.cur;
  if(!c)return `<h1>Match en direct</h1><div class="card"><div class="empty">Aucun match en cours.${A()?`<br><br><button class="btn" data-go="tirage">Choisir un match</button>`:""}</div></div>`;
  const m=S.matches[c.p][c.mi],q=c.qs[c.qi],ad=A();
  const head=`<div class="lg tv-lg"></div>`;
  if(c.over)return `<h1>Match en direct</h1><div class="tv"><div class="lg">100% <b>RAMONTÉ</b></div><div class="banner" style="font-size:24px">🏆 ${nm(m.w)} remporte le match !<br><span style="color:#fff;font-size:20px">${nm(m.a)} ${m.sa} – ${m.sb} ${nm(m.b)}</span></div>${ad?`<div class="row" style="justify-content:center"><button class="btn g" data-act="quit">Retour au tirage</button></div>`:""}</div>`;
  const turn=c.qi%2===0?"a":"b",extra=c.qi>=S.set.qpm;
  const b=(i,t)=>{let k="";if(c.ans)k=i===q.c?"ok":(i===c.pick?"ko":"dim");return `<button class="${k}" data-ans="${i}" ${c.ans||!ad?"disabled":""}>${esc(t)}</button>`;};
  return `<h1>Match en direct</h1><div class="tv"><div class="lg">100% <b>RAMONTÉ</b></div>
  <div class="ph">${PH[c.p]} · Match ${c.mi+1} · ${extra?"⚡ Question de départage":"Question "+(c.qi+1)+" / "+S.set.qpm}</div>
  <div class="stage"><div class="pan ${turn==="a"?"act":""}"><span class="nm">${nm(m.a)}</span><div class="pt">${m.sa}</div><span class="lb">POINTS</span><span class="st">⭐</span></div>
  <div class="pan p2 ${turn==="b"?"act":""}"><span class="nm">${nm(m.b)}</span><div class="pt">${m.sb}</div><span class="lb">POINTS</span><span class="st">⭐</span></div>
  <div class="timer ${left<=5&&!c.ans&&ad?"low":""}" id="tm">${ad?Math.max(left,0):"⏱"}</div></div>
  <div class="qinfo">À <b>${nm(m[turn])}</b> de répondre</div>
  <div class="qbar">${esc(q.q)}</div><div class="ans">${b(0,q.a)}${b(1,q.b)}</div>
  ${c.ans?`<div class="banner">${esc(c.msg)}</div>${ad?`<div class="row" style="justify-content:center"><button class="btn g" data-act="nextq">Suivant ➡</button></div>`:""}`:
  ad?`<div class="row" style="justify-content:center;margin-top:12px"><button class="btn" data-act="pause">${paused?"▶ Reprendre":"⏸ Pause"}</button><button class="btn r" data-act="quit">Quitter</button></div>`:""}</div>
  ${ad?`<div class="sub">Cliquez sur la réponse donnée par le candidat.</div>`:`<div class="sub">Vous suivez ce match en tant que spectateur.</div>`}`;
}
function vClass(){
  const t=totals(),w=wins(),inQ=new Set(qual());
  const rows=S.names.map((n,i)=>({i,n,p:t[i]||0,w:w[i]||0})).sort((a,b)=>b.p-a.p||b.w-a.w||a.n.localeCompare(b.n));
  return `<h1>Classement</h1><div class="card" style="overflow-x:auto"><table><tr><th class="num">#</th><th>Candidat</th><th class="num">V</th><th class="num">Pts</th><th>Statut</th></tr>
  ${rows.map((r,k)=>`<tr class="${k<3&&r.p>0?"top3":""}"><td class="num">${k+1}</td><td>${esc(r.n)}</td><td class="num">${r.w}</td><td class="num"><b>${r.p}</b></td><td>${S.out[r.i]!=null?`<span class="tag out">éliminé · ${PH[S.out[r.i]]}</span>`:inQ.has(r.i)?`<span class="tag in">${S.final?"qualifié":"en lice"}</span>`:""}</td></tr>`).join("")}</table></div>`;
}
function vQ(){
  const p=UI.qp,bank=S.banks[p],e=UI.editQ;
  const f=e?(e.i===-1?{q:"",a:"",b:"",c:0}:bank[e.i]):null;
  return `<div class="row sp" style="margin-bottom:12px"><h1 style="margin:0">Questions</h1>${A()?`<button class="btn" data-act="addq">＋ Ajouter</button>`:""}</div>
  <div class="phasebar">${PH.map((l,i)=>`<div class="${i===p?"on":""}" data-qp="${i}" style="cursor:pointer">${l}<br><small>${S.banks[i].length}</small></div>`).join("")}</div>
  ${f&&A()?`<div class="card"><h2>${e.i===-1?"Nouvelle question":"Modifier la question"}</h2><label>Question</label><textarea id="fq" style="min-height:70px">${esc(f.q)}</textarea>
   <div class="g2"><div><label>Réponse A</label><input id="fa" value="${esc(f.a)}"></div><div><label>Réponse B</label><input id="fb" value="${esc(f.b)}"></div></div>
   <label>Bonne réponse</label><select id="fc"><option value="0" ${f.c===0?"selected":""}>A</option><option value="1" ${f.c===1?"selected":""}>B</option></select>
   <div class="row" style="margin-top:12px"><button class="btn g" data-act="saveq">Enregistrer</button><button class="btn l" data-act="cancelq">Annuler</button></div></div>`:""}
  <div class="card">${bank.length?bank.map((x,i)=>`<div class="item"><div class="tx"><b style="white-space:normal">${esc(x.q)}</b><small>A : ${esc(x.a)} · B : ${esc(x.b)} · ✔ ${x.c?"B":"A"}</small></div>
   ${A()?`<button class="btn s l" data-act="editq" data-i="${i}">✏</button><button class="btn s r" data-act="delq" data-i="${i}">🗑</button>`:""}</div>`).join(""):`<div class="empty">Aucune question.</div>`}</div>`;
}
function report(){
  const t=totals(),w=wins(),lg=S.log,ok=lg.filter(l=>l.ok).length;
  const L=[`RAPPORT 100% RAMONTÉ`,`Candidats : ${S.names.length} · En lice : ${S.final?0:qual().length}`,`Phase : ${S.final?"terminé":PH[S.phase]}`,`Réponses : ${lg.length} (${lg.length?Math.round(100*ok/lg.length):0} % justes)`,``,`Classement :`];
  S.names.map((n,i)=>({n,p:t[i]||0,w:w[i]||0})).sort((a,b)=>b.p-a.p||b.w-a.w).forEach((r,k)=>L.push(`${k+1}. ${r.n} — ${r.p} pts, ${r.w} victoire(s)`));
  return L.join("\n");
}
function vRap(){
  const lg=S.log,ok=lg.filter(l=>l.ok).length,ms=matchesAll().filter(x=>!x.m.bye);
  return `<h1>Rapports</h1><div class="stats"><div class="stat"><b>${lg.length}</b><span>Réponses données</span></div><div class="stat"><b>${lg.length?Math.round(100*ok/lg.length):0} %</b><span>Bonnes réponses</span></div>
  <div class="stat"><b>${lg.filter(l=>l.to).length}</b><span>Temps écoulés</span></div><div class="stat"><b>${ms.filter(x=>x.m.done).length}/${ms.length}</b><span>Matchs terminés</span></div></div>
  <div class="card"><h2>Par phase</h2><table><tr><th>Phase</th><th class="num">Réponses</th><th class="num">Justes</th></tr>${PH.map((l,p)=>{const x=lg.filter(z=>z.p===p);return `<tr><td>${l}</td><td class="num">${x.length}</td><td class="num">${x.filter(z=>z.ok).length}</td></tr>`}).join("")}</table></div>
  <div class="card"><h2>Résultats des matchs</h2>${ms.filter(x=>x.m.done).map(x=>`<div class="item"><span class="tag">${PH[x.p].slice(0,5)}.</span><div class="tx"><b>${nm(x.m.a)} ${x.m.sa} – ${x.m.sb} ${nm(x.m.b)}</b><small>Vainqueur : ${nm(x.m.w)}</small></div></div>`).join("")||`<div class="empty">Aucun match terminé.</div>`}</div>
  <button class="btn" data-act="copy">📋 Copier le rapport</button>`;
}
function vSet(){
  const d=!A();
  return `<h1>Réglages</h1><div class="card"><h2>Règles du jeu</h2><div class="g2"><div><label>Secondes par question</label><input type="number" id="secs" min="5" max="60" value="${S.set.secs}"></div><div><label>Questions par match</label><input type="number" id="qpm" min="2" max="20" step="2" value="${S.set.qpm}"></div></div>
  <label>Points par bonne réponse</label><div class="g3">${PH.map((l,i)=>`<div><div class="sub">${l}</div><input type="number" id="pt${i}" min="1" value="${S.set.pts[i]}"></div>`).join("")}</div>
  ${d?"":`<div style="margin-top:12px"><button class="btn g" data-act="saveset">Enregistrer</button></div>`}</div>
  ${d?"":`<div class="card"><h2>Remise à zéro</h2><p class="sub">Efface le tirage, les scores et le classement. Les candidats et les questions sont conservés.</p>
  <div style="margin-top:10px"><button class="btn r" data-act="rt">${UI.arm==="rt"?"Confirmer la remise à zéro":"Remettre le tournoi à zéro"}</button></div></div>
  <div class="card"><h2>Tout réinitialiser</h2><p class="sub">Rétablit les candidats, les questions et les règles par défaut.</p>
  <div style="margin-top:10px"><button class="btn r" data-act="ra">${UI.arm==="ra"?"Confirmer : tout effacer":"Tout réinitialiser"}</button></div></div>`}`;
}
function vMdp(){
  if(!sb)return `<h1>Mon compte</h1><div class="card"><p class="sub">Mode local : Supabase n'est pas configuré (voir config.js). Les données restent dans ce navigateur.</p></div>`;
  if(session)return `<h1>Mon compte</h1><div class="card"><h2>Administrateur</h2><p class="sub">${esc(session.user.email||"")}</p><div style="margin-top:10px"><button class="btn l" data-act="logout">Se déconnecter</button></div></div>
  <div class="card"><h2>Changer mon mot de passe</h2><label>Nouveau mot de passe</label><input id="npw" type="password" placeholder="8 caractères minimum"><div style="margin-top:10px"><button class="btn g" data-act="chpw">Enregistrer</button></div></div>`;
  return `<h1>Connexion</h1><div class="card"><h2>Accès administrateur</h2><p class="sub">Les spectateurs n'ont pas besoin de se connecter.</p>
  <label>E-mail</label><input id="em" type="email" autocomplete="username"><label>Mot de passe</label><input id="pw" type="password" autocomplete="current-password">
  <div style="margin-top:12px"><button class="btn g" data-act="login">Se connecter</button></div></div>`;
}
const VIEWS={dash:vDash,cands:vCands,tirage:vTirage,match:vMatch,classement:vClass,questions:vQ,rapports:vRap,reglages:vSet,mdp:vMdp};
function render(){
  const act=document.activeElement&&document.activeElement.id;
  const keep={};["srch","newc","ec","fq","fa","fb","fc","bulk","pin","npin"].forEach(k=>{const e=$(k);if(e)keep[k]=e.value;});
  $("drawer").innerHTML=`<div class="hd"><b>SUNU SECTION</b><button data-act="menu">✕</button></div>`.replace("SUNU SECTION","100% RAMONTÉ")+MENU.map(m=>`<button class="it ${UI.tab===m[0]?"on":""}" data-go="${m[0]}"><i>${m[1]}</i>${m[2]}</button>`).join("");
  $("drawer").classList.toggle("on",UI.menu);$("back").classList.toggle("on",UI.menu);
  $("ttl").textContent=(MENU.find(m=>m[0]===UI.tab)||[])[2]||"";
  $("who").innerHTML=`<span class="dot ${conn==="live"?"on":conn==="ro"?"off":""}"></span>${A()?"Administrateur":"Spectateur"}`;
  const keepY=window.scrollY;
  $("app").innerHTML=VIEWS[UI.tab]();
  Object.entries(keep).forEach(([k,v])=>{const e=$(k);if(e&&UI.tab!=="reglages")e.value=v;});
  if(act&&$(act)&&act==="srch"){const e=$(act);e.focus();e.setSelectionRange(e.value.length,e.value.length);}
}
document.addEventListener("input",e=>{if(e.target.id==="srch"){UI.search=e.target.value;render();}});
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act],[data-go],[data-play],[data-ans],[data-win],[data-reset],[data-qp]");if(!t)return;const d=t.dataset;
  if(d.go){UI.tab=d.go;UI.menu=false;render();window.scrollTo(0,0);return;}
  if(d.qp!==undefined){UI.qp=+d.qp;UI.editQ=null;render();return;}
  if(d.act==="menu"){UI.menu=!UI.menu;render();return;}
  if(d.act==="login")return doLogin();
  if(d.act==="logout")return doLogout();
  if(d.act==="chpw")return doChangePw();
  if(!A())return;
  const i=+d.i;
  if(d.play!==undefined)return startMatch(+d.play);
  if(d.ans!==undefined)return answer(+d.ans);
  if(d.win!==undefined){const m=S.matches[S.phase][+d.win];m.w=d.s==="a"?m.a:m.b;m.done=true;S.cur=null;return commit();}
  if(d.reset!==undefined){const k=+d.reset,m=S.matches[S.phase][k];m.sa=m.sb=0;m.done=false;m.w=null;S.log=S.log.filter(l=>!(l.p===S.phase&&l.mi===k));return commit();}
  switch(d.act){
    case "draw":draw();break;
    case "next":nextPhase();UI.tab=S.final?"classement":"tirage";render();break;
    case "nextq":nextQ();break;
    case "pause":paused=!paused;render();break;
    case "quit":clearInterval(tmr);S.cur=null;UI.tab="tirage";commit();break;
    case "addc":UI.addC=!UI.addC;render();break;
    case "savenew":{const v=$("newc").value.trim();if(v){S.names.push(v);UI.addC=false;commit();toast("Candidat ajouté");}break;}
    case "editc":UI.editC=i;render();break;
    case "savec":{const v=$("ec").value.trim();if(v)S.names[i]=v;UI.editC=null;commit();break;}
    case "delc":S.names.splice(i,1);commit();break;
    case "bulk":{const ls=$("bulk").value.split("\n").map(s=>s.trim()).filter(Boolean);S.names.push(...ls);commit();toast(ls.length+" ajouté(s)");break;}
    case "addq":UI.editQ={i:-1};render();break;
    case "editq":UI.editQ={i};render();break;
    case "cancelq":UI.editQ=null;render();break;
    case "saveq":{const o={q:$("fq").value.trim(),a:$("fa").value.trim(),b:$("fb").value.trim(),c:+$("fc").value};
      if(!o.q||!o.a||!o.b){toast("Remplissez la question et les deux réponses.");break;}
      if(UI.editQ.i===-1)S.banks[UI.qp].push(o);else S.banks[UI.qp][UI.editQ.i]=o;S.used[UI.qp]=[];UI.editQ=null;commit();toast("Question enregistrée");break;}
    case "delq":S.banks[UI.qp].splice(i,1);S.used[UI.qp]=[];commit();break;
    case "saveset":S.set={secs:Math.max(5,+$("secs").value||15),qpm:Math.max(2,+$("qpm").value||6),pts:[0,1,2].map(k=>+$("pt"+k).value||10)};commit();toast("Réglages enregistrés");break;
    case "rt":if(UI.arm!=="rt"){UI.arm="rt";render();setTimeout(()=>{UI.arm=null;render();},4000);}else{UI.arm=null;const n=S.names,b=S.banks,s=S.set,p=S.pin;S=Object.assign(fresh(),{names:n,banks:b,set:s,pin:p});clearInterval(tmr);UI.tab="dash";commit();}break;
    case "ra":if(UI.arm!=="ra"){UI.arm="ra";render();setTimeout(()=>{UI.arm=null;render();},4000);}else{UI.arm=null;const p=S.pin;S=Object.assign(fresh(),{pin:p});clearInterval(tmr);UI.tab="dash";commit();}break;
    case "copy":try{navigator.clipboard.writeText(report()).then(()=>toast("Rapport copié"),()=>toast("Copie refusée"));}catch(x){toast("Copie impossible");}break;
  }
});
render();
</script>
</body>
