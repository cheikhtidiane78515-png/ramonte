<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>100% Ramonté — Plateforme de jeu</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0d3b1c;--navy2:#2d6a3e;--gl:#d4a82a;--cy:#5fe0ff;--bl:#1478ff;--gr:#35c93a;--rd:#e8433f;--gold:#ffd23f;--bg:#f2f6f2;--ink:#0d3b1c}
body{font-family:Inter,"Trebuchet MS",Verdana,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
button{font:inherit;cursor:pointer}
/* barre du haut */
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e3e7f1;height:56px;display:flex;align-items:center;gap:10px;padding:0 12px}
.top .burger{border:0;background:none;font-size:26px;color:var(--ink);padding:4px 8px}
.top .tlogo{width:34px;height:34px;flex:0 0 34px;border-radius:50%;border:2px solid var(--gold);background:#fff center/cover no-repeat}
.top .ttl{font-weight:800;font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .who{font-size:13px;color:#555;white-space:nowrap}
.top .out{border:0;background:none;font-size:20px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:#999}
.dot.on{background:var(--gr)}.dot.off{background:var(--rd)}
/* tiroir */
.back{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;opacity:0;pointer-events:none;transition:.2s}
.back.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:82%;max-width:330px;background:linear-gradient(180deg,#0f4a24,#0a2e15);color:#fff;z-index:31;transform:translateX(-102%);transition:.22s;padding:16px 12px 0;overflow-y:auto;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .hd{display:flex;align-items:center;gap:12px;padding:2px 4px 18px}
.drawer .hd b{flex:1;font-family:Georgia,"Times New Roman",serif;font-size:22px;letter-spacing:.3px}
.drawer .hd button{background:none;border:0;color:#fff;font-size:26px}
.drawer .logo{width:58px;height:58px;flex:0 0 58px;border-radius:50%;border:3px solid var(--gl);background:#fff center/cover no-repeat;display:grid;place-items:center;font-size:26px}
.drawer .it{display:flex;align-items:center;gap:16px;width:100%;border:1px solid transparent;background:none;color:#fff;text-align:left;padding:14px 14px;border-radius:14px;font-size:17px;margin-bottom:4px}
.drawer .it.on{background:var(--navy2);border-color:#b8963a}
.drawer .it i{font-style:normal;width:28px;text-align:center;font-size:21px}
.drawer .deco{margin:auto -12px 0;padding-top:16px;line-height:0}
.drawer .deco svg{width:100%;height:auto}
main{max-width:960px;margin:0 auto;padding:14px 12px 60px}
/* cartes admin */
.card{background:#fff;border:1px solid #e3e7f1;border-radius:14px;padding:14px;margin-bottom:12px}
h1{font-size:22px;margin-bottom:12px}
h2{font-size:17px;margin-bottom:10px}
.sub{font-size:13px;color:#6a7390}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:#fff;border:1px solid #e3e7f1;border-radius:14px;padding:14px}
.stat b{display:block;font-size:28px}
.stat span{font-size:12px;color:#6a7390}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;font-size:15px;color:#fff;background:var(--navy)}
.btn.g{background:#1f9a3a}.btn.r{background:#c92f2b}.btn.y{background:#e0a800;color:#3a2a00}.btn.l{background:#e8ecf7;color:var(--ink)}
.btn.s{padding:6px 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.4}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{justify-content:space-between}
input,select,textarea{width:100%;border:1px solid #cfd6e8;border-radius:10px;padding:10px;font:inherit;font-size:15px;background:#fff;color:var(--ink)}
textarea{min-height:120px;resize:vertical}
label{display:block;font-size:12px;font-weight:700;color:#6a7390;margin:10px 0 4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.item{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #eef0f6}
.item:last-child{border:0}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .tx small{color:#6a7390}
.tag{font-size:11px;border-radius:12px;padding:3px 9px;background:#e8ecf7;font-weight:700;white-space:nowrap}
.tag.in{background:#d9f4de;color:#176b2a}.tag.out{background:#fbe0df;color:#8e2420}.tag.y{background:#fff0bf;color:#6b4d00}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 6px;text-align:left;border-bottom:1px solid #eef0f6}
th{font-size:11px;text-transform:uppercase;color:#6a7390}
.num{text-align:center}
tr.top3 td:first-child{color:#c88a00;font-weight:900}
.phasebar{display:flex;gap:6px;margin-bottom:12px}
.phasebar div{flex:1;text-align:center;padding:8px 2px;border-radius:10px;background:#e8ecf7;font-size:12px;font-weight:700}
.phasebar div.on{background:var(--navy);color:#fff}.phasebar div.sk{opacity:.5;text-decoration:line-through}.phasebar div.ok{background:#d9f4de;color:#176b2a}
.match{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #eef0f6;flex-wrap:wrap}
.match .n{width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px}
.match .pl{flex:1;min-width:90px;font-weight:600}
.match .pl.w{color:#1f9a3a;font-weight:900}
.match .sc{font-weight:900}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;z-index:50;font-size:14px;max-width:90%}
.empty{text-align:center;color:#6a7390;padding:20px}
/* écran TV */
.tv{border-radius:20px;padding:14px 12px 18px;color:#fff;background:radial-gradient(ellipse at 50% 0,#14753f 0,#0b4a26 45%,#06301a 100%);position:relative;overflow:hidden;margin-bottom:12px;border:1px solid rgba(240,192,64,.35)}
.tv>*{position:relative;z-index:1}
.tv .sw{position:absolute;z-index:0;pointer-events:none}
.tv .sw.l{left:-30px;top:20px;width:55%}.tv .sw.r{right:-30px;top:20px;width:55%;transform:scaleX(-1)}
.tv .sw.bl{left:-30px;bottom:-6px;width:55%;transform:scaleY(-1)}.tv .sw.br{right:-30px;bottom:-6px;width:55%;transform:scale(-1,-1)}
.tv .mq{position:absolute;right:6px;top:8px;width:64px;opacity:.9;z-index:0}
.tv .hd{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:2px}
.tv .tl{width:62px;height:62px;border-radius:50%;border:4px solid #f0c040;background:#fff center/cover no-repeat;flex:0 0 auto;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.tv .tt{font-family:Georgia,"Times New Roman",serif;font-weight:800;font-size:28px;line-height:1.05;text-shadow:0 3px 6px rgba(0,0,0,.4)}
.tv .live{display:flex;justify-content:center;margin:10px 0 6px}
.tv .live span{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(#fbd45f,#eba827);color:#0b3d22;font-weight:900;font-size:17px;letter-spacing:.5px;padding:6px 20px;border-radius:30px;box-shadow:0 4px 10px rgba(0,0,0,.35)}
.tv .live i{width:11px;height:11px;border-radius:50%;background:#e0261f;box-shadow:0 0 0 4px rgba(224,38,31,.3);display:inline-block}
.tv .ph{display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;font-size:13px;margin:8px 0 10px}
.tv .ph:before,.tv .ph:after{content:"";height:1px;background:#e8b92d;flex:1;opacity:.8}
.tv .ph b{color:#f0c040}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:0;position:relative}
.pan{min-height:140px;padding:12px 8px 10px;text-align:center;position:relative;overflow:hidden;background:linear-gradient(135deg,#0f6d38,#0a4f29);border:2px solid #2a8b52;border-radius:20px 0 0 20px}
.pan.p2{background:linear-gradient(135deg,#fbd24a,#e9a41f);border-color:#f3c548;border-radius:0 20px 20px 0;color:#1d1a05}
.pan.act{box-shadow:0 0 0 3px #f0c040,0 0 22px rgba(240,192,64,.7);z-index:1}
.pan .nm{display:inline-block;background:#04230f;color:#fff;border:1px solid #d9ac2c;border-radius:14px;padding:4px 12px;font-weight:900;font-size:14px;max-width:92%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase}
.pan .pt{font-size:50px;font-weight:900;line-height:1;margin-top:8px}
.pan .lb{display:inline-block;font-size:11px;font-weight:900;color:#0b3d22;background:#fff;border-radius:12px;padding:2px 12px;margin-top:4px}
.pan .st{position:absolute;right:8px;bottom:4px;font-size:26px}
.pan.p2 .st{right:6px}.pan:not(.p2) .st{left:auto;right:18px}
.timer{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;background:#06301a;border:6px solid #2ecc54;display:flex;align-items:baseline;justify-content:center;padding-top:20px;box-sizing:border-box;white-space:nowrap;font-size:26px;font-weight:900;z-index:3;box-shadow:0 0 0 3px #f0c040,0 6px 14px rgba(0,0,0,.45)}
.timer small{font-size:13px;margin-left:2px}
.timer.low{border-color:#e0261f;color:#ffb3ae}
.qinfo{display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;text-align:center;margin-top:14px}
.qinfo:before,.qinfo:after{content:"";height:1px;background:#e8b92d;flex:1;opacity:.8;max-width:70px}
.qinfo b{color:#f0c040;text-transform:uppercase}
.qbar{display:flex;align-items:center;gap:12px;margin-top:10px;background:rgba(3,40,20,.75);border:2px solid #d9ac2c;border-radius:16px;padding:14px 12px;font-size:18px;font-weight:800;line-height:1.3;text-align:center}
.qbar svg{flex:0 0 auto}.qbar span{flex:1}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.ans button{padding:14px 6px;font-size:18px;font-weight:800;color:#fff;border-radius:30px;border:2px solid #cfe9d6;background:#06381d}
.ans button:not([disabled]):active{background:linear-gradient(#25b335,#0f8a1f)}
.ans button.ok{background:linear-gradient(#25b335,#0f8a1f);border-color:#fff}.ans button.ko{background:linear-gradient(#ff6a66,#b82723);border-color:#fff}.ans button.dim{opacity:.55}
.banner{display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;padding:14px 8px 6px;font-size:17px;font-weight:900;color:#f0c040}
.tv .btn{border:0;color:#0b3d22;font-weight:800;background:linear-gradient(#fbd45f,#eba827);border-radius:26px;padding:12px 34px;font-size:18px;box-shadow:0 5px 12px rgba(0,0,0,.35)}
.tv .btn.g{background:linear-gradient(#fbd45f,#eba827)}.tv .btn.r{background:#06381d;color:#fff;border:2px solid #cfe9d6}
@media(max-width:520px){.pan .pt{font-size:42px}.qbar{font-size:15px}.ans button{font-size:15px}.tv .tt{font-size:22px}.tv .tl{width:50px;height:50px}.tv .mq{width:46px}}

#landing{position:fixed;inset:0;z-index:60;overflow:auto;color:#fff;font-family:Inter,"Trebuchet MS",sans-serif;background:radial-gradient(ellipse at 50% -5%,#10805a 0,#0b5a3a 32%,#06361f 70%,#032414 100%)}
#landing .wrap{position:relative;max-width:460px;margin:0 auto;padding:24px 20px 150px;min-height:100%}
#landing .mosq{position:absolute;right:-6px;top:0;width:150px;opacity:.5;pointer-events:none}
#landing .waves{position:fixed;left:0;right:0;bottom:0;width:100%;pointer-events:none;z-index:-1}
#landing .book{position:absolute;left:50%;bottom:34px;width:230px;transform:translateX(-50%);opacity:.22;pointer-events:none}
.lg-logo{position:relative;width:112px;height:112px;border-radius:50%;border:4px solid #e8b92d;background:#fff center/cover no-repeat;margin:0 auto;box-shadow:0 0 0 2px rgba(232,185,45,.3),0 8px 24px rgba(0,0,0,.35)}
.lg-title{position:relative;font-family:Georgia,"Times New Roman",serif;font-weight:800;font-size:40px;text-align:center;margin-top:10px;line-height:1.05;text-shadow:0 3px 8px rgba(0,0,0,.35)}
.lg-title b{color:#f0c040}
.lg-sw{display:block;margin:-2px auto 0;width:300px;max-width:80%}
.lg-tag{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;font-size:13px;margin:8px 0 24px;text-align:center}
.lg-tag:before,.lg-tag:after{content:"";height:1px;background:#e8b92d;flex:1;max-width:46px;opacity:.85}
.lg-card{position:relative;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.28);border-radius:26px;padding:24px 20px 20px;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.lg-card h2{font-size:34px;font-weight:800;margin:0}
.lg-bar{width:76px;height:5px;border-radius:3px;background:#f0c040;margin:10px 0 14px}
.lg-card p.d{font-size:17px;line-height:1.45;color:rgba(255,255,255,.95)}
.lg-in{display:flex;align-items:center;gap:12px;border:1px solid rgba(255,255,255,.38);background:rgba(255,255,255,.08);border-radius:18px;padding:0 14px;height:56px;margin-top:14px}
.lg-in svg{flex:0 0 auto}
.lg-in input{flex:1;min-width:0;width:auto;background:none;border:0;outline:0;border-radius:0;padding:0;height:100%;color:#fff;font-size:17px}
.lg-in input::placeholder{color:rgba(255,255,255,.85)}
.lg-in button{background:none;border:0;color:#fff;font-size:20px;padding:0 2px}
.lg-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;font-size:15px}
.lg-row label{display:flex;align-items:center;gap:10px;margin:0;font-size:15px;font-weight:400;color:#fff}
.lg-row input[type=checkbox]{width:24px;height:24px;accent-color:#f0c040;margin:0}
.lg-row button{background:none;border:0;color:#f0c040;font-size:15px;padding:0}
.lg-btn{width:100%;height:58px;border:0;border-radius:18px;background:linear-gradient(#fbd45f,#eba827);color:#0b3d22;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;gap:12px;margin-top:18px;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.lg-foot{display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;margin-top:16px}
.lg-spec{display:block;width:100%;background:none;border:0;color:#f0c040;font-size:16px;font-weight:700;margin-top:18px;text-align:center;position:relative}
#lmsg{min-height:20px;margin-top:12px;font-size:14px;color:#ffd7d4;text-align:center}
@media(max-width:380px){.lg-title{font-size:34px}}
</style>
</head>
<body>
<div class="top">
  <button class="burger" data-act="menu" aria-label="Menu">☰</button>
  <div class="tlogo" id="tlogo"></div>
  <div class="ttl" id="ttl">100% Ramonté</div>
  <div class="who" id="who"></div>
  <button class="out" data-act="exit" title="Déconnexion">⎋</button>
</div>
<div class="back" id="back" data-act="menu"></div>
<aside class="drawer" id="drawer"></aside>
<main id="app"></main>
<div id="landing"><div class="wrap">
<svg class="mosq" viewBox="0 0 150 240" xmlns="http://www.w3.org/2000/svg"><g fill="#3f9d63"><path d="M128 20a22 22 0 1 0 14 38 18 18 0 1 1-14-38z"/><rect x="118" y="86" width="22" height="130"/><path d="M114 86Q129 60 144 86Z"/><rect x="112" y="116" width="34" height="9"/><path d="M20 190Q22 140 78 128Q132 140 134 190Z" opacity=".85"/></g></svg>
<div class="lg-logo" id="lglogo"></div>
<div class="lg-title">Jardin du <b>Khilass</b></div>
<svg class="lg-sw" viewBox="0 0 300 26"><path d="M6 20C70 4 170 4 294 12C190 12 90 26 6 20Z" fill="#35b864"/><path d="M6 20C70 5 170 4 294 12" stroke="#f0c040" stroke-width="2" fill="none"/></svg>
<div class="lg-tag">Suivi · Organisation · Activités · Engagement</div>
<div class="lg-card"><h2>Bienvenue !</h2><div class="lg-bar"></div>
<p class="d">Connectez-vous à votre espace pour gérer les activités et le suivi des jeux d'esprit.</p>
<div class="lg-in"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7l8 6 8-6"/></svg><input id="lem" type="email" placeholder="Email" autocomplete="username"></div>
<div class="lg-in"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="3"/><path d="M8 11V8a4 4 0 018 0v3"/></svg><input id="lpw" type="password" placeholder="Mot de passe" autocomplete="current-password"><button data-act="eye" aria-label="Afficher">👁</button></div>
<div class="lg-row"><label><input type="checkbox" id="lrem" checked>Se souvenir de moi</label><button data-act="forgot">Mot de passe oublié ?</button></div>
<button class="lg-btn" data-act="enter"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#0b3d22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M13 4h6a2 2 0 012 2v12a2 2 0 01-2 2h-6"/></svg>Se connecter</button>
<div id="lmsg"></div>
<div class="lg-foot"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.4 2.7-6 6-6s6 2.6 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M16.5 14.2c2.6.2 4.5 2.2 4.5 4.8"/></svg>Accès réservé aux membres autorisés.</div></div>
<svg class="book" viewBox="0 0 240 110" fill="none" stroke="#9fd8b4" stroke-width="2.5" stroke-linejoin="round"><path d="M120 20C90 6 50 6 12 16V90C50 80 90 80 120 96C150 80 190 80 228 90V16C190 6 150 6 120 20Z"/><path d="M120 20V96"/><path d="M30 28C60 22 90 24 108 32M30 44C60 38 90 40 108 48M132 32C150 24 180 22 210 28M132 48C150 40 180 38 210 44" stroke-width="1.6"/></svg>
<svg class="waves" viewBox="0 0 400 120" preserveAspectRatio="none" height="120"><path d="M0 40C80 70 170 110 270 120L0 120Z" fill="#0a7a48" opacity=".55"/><path d="M0 28C80 60 170 104 280 120" stroke="#f0c040" stroke-width="5" fill="none"/><path d="M400 56C330 62 250 92 160 120L400 120Z" fill="#0a7a48" opacity=".45"/><path d="M400 44C330 52 250 86 150 120" stroke="#f0c040" stroke-width="4" fill="none"/></svg>
</div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const PH=["Préliminaires","Huitièmes de finale","Quarts de finale","Demi-finales","Finale"];
const BK=[

const matchesAll=()=>S.matches.flatMap((ms,p)=>ms.map((m,i)=>({m,p,i})));
function totals(){const t={};matchesAll().forEach(({m})=>{t[m.a]=(t[m.a]||0)+m.sa;if(m.b!=null)t[m.b]=(t[m.b]||0)+m.sb;});return t;}
function wins(){const w={};matchesAll().forEach(({m})=>{if(m.done&&m.w!=null&&!m.bye)w[m.w]=(w[m.w]||0)+1;});return w;}
const started=()=>S.drawn.some(Boolean);
const pow2=x=>{let k=1;while(k*2<=x)k*=2;return k;};
const useRep=()=>S.rep!==null&&S.rep!==undefined?S.rep:S.names.length<=14;
function target(p,n){ // nombre de qualifiés visé à la fin de la phase p
  if(useRep()){ // petit nombre : gagnants directs au quart, perdants repêchés en huitièmes
    if(p<=1)return n-Math.floor(n/2);
    return [0,0,4,2,1][p];
  }
  if(p===0){ if(n>16||(n&(n-1)))return (n&(n-1))?pow2(n):n/2; return n; }
  return [0,8,4,2,1][p];
}
const inLice=()=>qual().concat(S.direct||[]);
function settle(){ // saute les phases inutiles selon le nombre de candidats
  const n=qual().length;
  while(S.phase<PH.length-1&&!S.drawn[S.phase]&&n<=target(S.phase,n))S.phase++;
}
function draw(){
  settle();
  if(S.phase===0&&!S.drawn[0])S.rep=S.names.length<=14;
  const p=S.phase,ids=shuffle(qual()),n=ids.length,t=Math.min(n,target(p,n)),m=n-t,ms=[];
  for(let i=0;i<m;i++)ms.push({a:ids[2*i],b:ids[2*i+1],sa:0,sb:0,done:false,w:null});
  for(let i=2*m;i<n;i++)ms.push({a:ids[i],b:null,sa:0,sb:0,done:true,w:ids[i],bye:true});
  S.matches[p]=ms;S.drawn[p]=true;S.cur=null;commit();
}
const phaseDone=()=>S.drawn[S.phase]&&S.matches[S.phase].length>0&&S.matches[S.phase].every(m=>m.done);
function prevPhase(){
  const h=(S.hist||[]).pop();if(!h)return false;
  Object.assign(S,{phase:h.phase,qualified:h.qualified,direct:h.direct,rep:h.rep,out:h.out,final:h.final});
  for(let k=h.phase+1;k<PH.length;k++){S.matches[k]=[];S.drawn[k]=false;S.used[k]=[];}
  S.log=S.log.filter(l=>l.p<=h.phase);S.cur=null;return true;
}
function nextPhase(){
  const p=S.phase,ms=S.matches[p];
  S.hist=(S.hist||[]).slice(-6);
  S.hist.push(JSON.parse(JSON.stringify({phase:S.phase,qualified:S.qualified,direct:S.direct||[],rep:S.rep===undefined?null:S.rep,out:S.out,final:S.final})));
  if(!useRep()){
    ms.forEach(m=>[m.a,m.b].forEach(x=>{if(x!=null&&x!==m.w)S.out[x]=p;}));
    S.qualified=ms.map(m=>m.w);
    if(p<PH.length-1)S.phase=p+1;else S.final=true;
  }else if(p===0){
    // gagnants : directs au quart ; perdants : jouent les huitièmes (repêchage)
    const win=ms.map(m=>m.w),los=[];
    ms.forEach(m=>{if(!m.bye)[m.a,m.b].forEach(x=>{if(x!==m.w)los.push(x);});});
    if(los.length>=2){S.direct=win;S.qualified=los;S.phase=1;}
    else{S.direct=[];S.qualified=win.concat(los);S.phase=2;}
  }else if(p===1){
    // les gagnants des huitièmes complètent le quart (limité à 8) : les meilleurs aux points sont retenus
    const direct=S.direct||[];let gw=ms.map(m=>m.w);
    const slots=Math.max(0,8-direct.length);
    if(gw.length>slots){const t=totals(),w=wins();gw=[...gw].sort((a,b)=>(t[b]||0)-(t[a]||0)||(w[b]||0)-(w[a]||0)).slice(0,slots);}
    const keep=new Set(gw);
    ms.forEach(m=>[m.a,m.b].forEach(x=>{if(x!=null&&!keep.has(x))S.out[x]=p;}));
    S.qualified=direct.concat(gw);S.direct=[];S.phase=2;
  }else{
    ms.forEach(m=>[m.a,m.b].forEach(x=>{if(x!=null&&x!==m.w)S.out[x]=p;}));
    S.qualified=ms.map(m=>m.w);
    if(p<PH.length-1)S.phase=p+1;else S.final=true;
  }

}
function pickQ(p,n){
  const bank=S.banks[p];let pool=bank.map((_,i)=>i).filter(i=>!S.used[p].includes(i));
  if(pool.length<n){S.used[p]=[];pool=bank.map((_,i)=>i);}
  const ids=shuffle(pool).slice(0,n);S.used[p].push(...ids);return ids.map(i=>bank[i]);
}
function startMatch(mi){
  const p=S.phase,m=S.matches[p][mi];
  if(!S.banks[p].length){toast("Ajoutez d'abord des questions pour cette phase.");return;}
  m.sa=0;m.sb=0;m.done=false;m.w=null;
  S.log=S.log.filter(l=>!(l.p===p&&l.mi===mi));
  S.cur={p,mi,qi:0,qs:pickQ(p,S.set.qpm),ans:false,pick:-1,msg:"",over:false};
  UI.tab="match";startTimer();commit();
}
function startTimer(){
  clearInterval(tmr);left=S.set.secs;paused=false;
  tmr=setInterval(()=>{
    if(paused||!S.cur||S.cur.ans||S.cur.over||!A())return;
    left--;const el=$("tm");if(el){el.innerHTML=Math.max(left,0)+"<small>s</small>";el.classList.toggle("low",left<=5);}
    if(left<=0)answer(-1);

function answer(idx){
  const c=S.cur;if(!c||c.ans||!A())return;
  const m=S.matches[c.p][c.mi],q=c.qs[c.qi],ok=idx===q.c,who=c.qi%2===0?"a":"b";
  c.ans=true;c.pick=idx;
  if(ok){if(who==="a")m.sa+=S.set.pts[c.p];else m.sb+=S.set.pts[c.p];}
  S.log.push({p:c.p,mi:c.mi,id:m[who],ok,to:idx===-1});
  c.msg=idx===-1?"Temps écoulé !":ok?"Bonne réponse ! +"+S.set.pts[c.p]+" pts":"Mauvaise réponse";
  commit();
}
function nextQ(){
  const c=S.cur,m=S.matches[c.p][c.mi];c.qi++;
  if(c.qi>=c.qs.length){
    if(m.sa===m.sb){c.qs.push(...pickQ(c.p,2));}
    else{m.done=true;m.w=m.sa>m.sb?m.a:m.b;c.over=true;clearInterval(tmr);commit();return;}
  }
  c.ans=false;c.pick=-1;c.msg="";startTimer();commit();
}

  const turn=c.qi%2===0?"a":"b",extra=c.qi>=S.set.qpm;
  const b=(i,t)=>{let k="";if(c.ans)k=i===q.c?"ok":(i===c.pick?"ko":"dim");return `<button class="${k}" data-ans="${i}" ${c.ans||!ad?"disabled":""}>${esc(t)}</button>`;};
  const hd=`<div class="hd"><div class="tl" style="background-image:url('${CFG.LOGO_URL}')"></div><div class="tt">Jardin du Khilass</div></div><div class="live"><span><i></i>MATCH EN DIRECT</span></div>`;
  return `<h1>Match en direct</h1><div class="tv">${SWL}${SWR}${MQ}${hd}
  <div class="ph"><span>${PH[c.p]} • <b>Match ${c.mi+1}</b> • ${extra?"⚡ Départage":"Question "+(c.qi+1)+" / "+S.set.qpm}</span></div>
  <div class="stage"><div class="pan ${turn==="a"?"act":""}"><span class="nm">${nm(m.a)}</span><div class="pt">${m.sa}</div><span class="lb">POINTS</span><span class="st">⭐</span></div>
  <div class="pan p2 ${turn==="b"?"act":""}"><span class="nm">${nm(m.b)}</span><div class="pt">${m.sb}</div><span class="lb">POINTS</span><span class="st">⭐</span></div>
  <div class="timer ${left<=5&&!c.ans&&ad?"low":""}" id="tm">${ad?Math.max(left,0)+"<small>s</small>":"⏱"}</div></div>
  <div class="qinfo"><span>À <b>${nm(m[turn])}</b> de répondre</span></div>
  <div class="qbar">${BOOK}<span>${esc(q.q)}</span></div><div class="ans">${b(0,q.a)}${b(1,q.b)}</div>
  ${c.ans?`<div class="banner">${CLOCK}${esc(c.msg)}</div>${ad?`<div class="row" style="justify-content:center"><button class="btn g" data-act="nextq">Suivant →</button></div>`:""}`:
  ad?`<div class="row" style="justify-content:center;margin-top:12px"><button class="btn" data-act="pause">${paused?"▶ Reprendre":"⏸ Pause"}</button><button class="btn r" data-act="quit">Quitter</button></div>`:""}${SWBL}${SWBR}</div>
  ${ad?`<div class="sub">Cliquez sur la réponse donnée par le candidat.</div>`:`<div class="sub">Vous suivez ce match en lecture seule.</div>`}`;
}
function vClass(){
  const t=totals(),w=wins(),inQ=new Set(inLice());
  const rows=S.names.map((n,i)=>({i,n,p:t[i]||0,w:w[i]||0})).sort((a,b)=>b.p-a.p||b.w-a.w||a.n.localeCompare(b.n));
  return `<h1>Classement</h1><div class="card" style="overflow-x:auto"><table><tr><th class="num">#</th><th>Candidat</th><th class="num">V</th><th class="num">Pts</th><th>Statut</th></tr>
  ${rows.map((r,k)=>`<tr class="${k<3&&r.p>0?"top3":""}"><td class="num">${k+1}</td><td>${esc(r.n)}</td><td class="num">${r.w}</td><td class="num"><b>${r.p}</b></td><td>${S.out[r.i]!=null?`<span class="tag out">éliminé · ${PH[S.out[r.i]]}</span>`:inQ.has(r.i)?`<span class="tag in">${S.final?"qualifié":"en lice"}</span>`:""}</td></tr>`).join("")}</table></div>`;
}
function vQ(){
  const p=UI.qp,bank=S.banks[p],e=UI.editQ;
  const f=e?(e.i===-1?{q:"",a:"",b:"",c:0}:bank[e.i]):null;
  return `<div class="row sp" style="margin-bottom:12px"><h1 style="margin:0">Questions</h1>${A()?`<button class="btn" data-act="addq">＋ Ajouter</button>`:""}</div>
  <div class="phasebar">${PH.map((l,i)=>`<div class="${i===p?"on":""}" data-qp="${i}" style="cursor:pointer">${l}<br><small>${S.banks[i].length}</small></div>`).join("")}</div>
  ${A()&&!f?`<div class="card"><h2>Chapitre 1</h2><p class="sub">${CH1.length} questions prêtes sur le Chapitre 1 de Khilâs adh-Dhahab.</p><div style="margin-top:10px"><button class="btn g" data-act="ch1">📘 Ajouter à « ${PH[p]} »</button></div></div>`:""}
  ${f&&A()?`<div class="card"><h2>${e.i===-1?"Nouvelle question":"Modifier la question"}</h2><label>Question</label><textarea id="fq" style="min-height:70px">${esc(f.q)}</textarea>
   <div class="g2"><div><label>Réponse A</label><input id="fa" value="${esc(f.a)}"></div><div><label>Réponse B</label><input id="fb" value="${esc(f.b)}"></div></div>
   <label>Bonne réponse</label><select id="fc"><option value="0" ${f.c===0?"selected":""}>A</option><option value="1" ${f.c===1?"selected":""}>B</option></select>
   <div class="row" style="margin-top:12px"><button class="btn g" data-act="saveq">Enregistrer</button><button class="btn l" data-act="cancelq">Annuler</button></div></div>`:""}
  <div class="card">${bank.length?bank.map((x,i)=>`<div class="item"><div class="tx"><b style="white-space:normal">${esc(x.q)}</b><small>A : ${esc(x.a)} · B : ${esc(x.b)} · ✔ ${x.c?"B":"A"}</small></div>
   ${A()?`<button class="btn s l" data-act="editq" data-i="${i}">✏</button><button class="btn s r" data-act="delq" data-i="${i}">🗑</button>`:""}</div>`).join(""):`<div class="empty">Aucune question.</div>`}</div>`;
}
function report(){
  const t=totals(),w=wins(),lg=S.log,ok=lg.filter(l=>l.ok).length;
  const L=[`RAPPORT 100% RAMONTÉ`,`Candidats : ${S.names.length} · En lice : ${S.final?0:inLice().length}`,`Phase : ${S.final?"terminé":PH[S.phase]}`,`Réponses : ${lg.length} (${lg.length?Math.round(100*ok/lg.length):0} % justes)`,``,`Classement :`];
  S.names.map((n,i)=>({n,p:t[i]||0,w:w[i]||0})).sort((a,b)=>b.p-a.p||b.w-a.w).forEach((r,k)=>L.push(`${k+1}. ${r.n} — ${r.p} pts, ${r.w} victoire(s)`));
  return L.join("\n");
}
function vRap(){
  const lg=S.log,ok=lg.filter(l=>l.ok).length,ms=matchesAll().filter(x=>!x.m.bye);
  return `<h1>Rapports</h1><div class="stats"><div class="stat"><b>${lg.length}</b><span>Réponses données</span></div><div class="stat"><b>${lg.length?Math.round(100*ok/lg.length):0} %</b><span>Bonnes réponses</span></div>
  <div class="stat"><b>${lg.filter(l=>l.to).length}</b><span>Temps écoulés</span></div><div class="stat"><b>${ms.filter(x=>x.m.done).length}/${ms.length}</b><span>Matchs terminés</span></div></div>
  <div class="card"><h2>Par phase</h2><table><tr><th>Phase</th><th class="num">Réponses</th><th class="num">Justes</th></tr>${PH.map((l,p)=>{const x=lg.filter(z=>z.p===p);return `<tr><td>${l}</td><td class="num">${x.length}</td><td class="num">${x.filter(z=>z.ok).length}</td></tr>`}).join("")}</table></div>
  <div class="card"><h2>Résultats des matchs</h2>${ms.filter(x=>x.m.done).map(x=>`<div class="item"><span class="tag">${PH[x.p].slice(0,5)}.</span><div class="tx"><b>${nm(x.m.a)} ${x.m.sa} – ${x.m.sb} ${nm(x.m.b)}</b><small>Vainqueur : ${nm(x.m.w)}</small></div></div>`).join("")||`<div class="empty">Aucun match terminé.</div>`}</div>
  <button class="btn" data-act="copy">📋 Copier le rapport</button>`;
}
function vSet(){
  const d=!A();
  return `<h1>Réglages</h1><div class="card"><h2>Règles du jeu</h2><div class="g2"><div><label>Secondes par question</label><input type="number" id="secs" min="5" max="60" value="${S.set.secs}"></div><div><label>Questions par match</label><input type="number" id="qpm" min="2" max="20" step="2" value="${S.set.qpm}"></div></div>
  <label>Points par bonne réponse</label><div class="g3">${PH.map((l,i)=>`<div><div class="sub">${l}</div><input type="number" id="pt${i}" min="1" value="${S.set.pts[i]}"></div>`).join("")}</div>
  ${d?"":`<div style="margin-top:12px"><button class="btn g" data-act="saveset">Enregistrer</button></div>`}</div>
  ${d?"":`<div class="card"><h2>Remise à zéro</h2><p class="sub">Efface le tirage, les scores et le classement. Les candidats et les questions sont conservés.</p>
  <div style="margin-top:10px"><button class="btn r" data-act="rt">${UI.arm==="rt"?"Confirmer la remise à zéro":"Remettre le tournoi à zéro"}</button></div></div>
  <div class="card"><h2>Tout réinitialiser</h2><p class="sub">Rétablit les candidats, les questions et les règles par défaut.</p>
  <div style="margin-top:10px"><button class="btn r" data-act="ra">${UI.arm==="ra"?"Confirmer : tout effacer":"Tout réinitialiser"}</button></div></div>`}`;
}
function vMdp(){
  if(!sb)return `<h1>Mon compte</h1><div class="card"><p class="sub">Mode local : Supabase n'est pas configuré (voir config.js). Les données restent dans ce navigateur.</p></div>`;
  if(session)return `<h1>Mon compte</h1><div class="card"><h2>Administrateur</h2><p class="sub">${esc(session.user.email||"")}</p><div style="margin-top:10px"><button class="btn l" data-act="logout">Se déconnecter</button></div></div>
  <div class="card"><h2>Changer mon mot de passe</h2><label>Nouveau mot de passe</label><input id="npw" type="password" placeholder="8 caractères minimum"><div style="margin-top:10px"><button class="btn g" data-act="chpw">Enregistrer</button></div></div>`;
  return `<h1>Connexion</h1><div class="card"><h2>Accès administrateur</h2><p class="sub">Accès réservé aux comptes autorisés.</p>
  <label>E-mail</label><input id="em" type="email" autocomplete="username"><label>Mot de passe</label><input id="pw" type="password" autocomplete="current-password">
  <div style="margin-top:12px"><button class="btn g" data-act="login">Se connecter</button></div></div>`;
}
const VIEWS={dash:vDash,cands:vCands,tirage:vTirage,match:vMatch,classement:vClass,questions:vQ,rapports:vRap,reglages:vSet,mdp:vMdp};
function render(){
  settle();
  if(sb&&!session)UI.landing=true;
  $("landing").style.display=UI.landing?"block":"none";
  const act=document.activeElement&&document.activeElement.id;
  const keep={};["srch","newc","ec","fq","fa","fb","fc","bulk","pin","npin"].forEach(k=>{const e=$(k);if(e)keep[k]=e.value;});
  const nmApp=CFG.APP_NAME||"Jardin du Khilass";
  $("drawer").innerHTML=`<div class="hd"><div class="logo" ${CFG.LOGO_URL?`style="background-image:url('${esc(CFG.LOGO_URL)}')"`:""}>${CFG.LOGO_URL?"":"🌙"}</div><b>${esc(nmApp)}</b><button data-act="menu">✕</button></div>`+MENU.map(m=>`<button class="it ${UI.tab===m[0]?"on":""}" data-go="${m[0]}"><i>${m[1]}</i>${m[2]}</button>`).join("")+`<div class="deco"><svg viewBox="0 0 300 120" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0cf63"/><stop offset="1" stop-color="#b8861f"/></linearGradient></defs>
<g fill="url(#gg)"><path d="M105 86Q105 46 150 40Q195 46 195 86Z"/><path d="M80 86Q80 66 98 62Q116 66 116 86Z"/><path d="M184 86Q184 66 202 62Q220 66 220 86Z"/><rect x="60" y="44" width="10" height="42"/><path d="M58 44L65 30L72 44Z"/><rect x="230" y="44" width="10" height="42"/><path d="M228 44L235 30L242 44Z"/><circle cx="150" cy="26" r="9"/></g><circle cx="154" cy="24" r="8" fill="#0d3b1c"/>
<path d="M0 88C70 62 150 108 300 66" stroke="#d4a82a" stroke-width="3" fill="none"/><path d="M0 98C70 72 150 118 300 76L300 120L0 120Z" fill="#d4a82a" opacity=".25"/></svg></div>`;
  $("drawer").classList.toggle("on",UI.menu);$("back").classList.toggle("on",UI.menu);
  $("ttl").textContent=(MENU.find(m=>m[0]===UI.tab)||[])[2]||"";
  $("who").innerHTML=`<span class="dot ${conn==="live"?"on":conn==="ro"?"off":""}"></span>${A()?"Administrateur":"Hors ligne"}`;
  const keepY=window.scrollY;
  $("app").innerHTML=VIEWS[UI.tab]();
  Object.entries(keep).forEach(([k,v])=>{const e=$(k);if(e&&UI.tab!=="reglages")e.value=v;});
  if(act&&$(act)&&act==="srch"){const e=$(act);e.focus();e.setSelectionRange(e.value.length,e.value.length);}
}
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.target.id==="lpw"||e.target.id==="lem"))doEnter();});
document.addEventListener("input",e=>{if(e.target.id==="srch"){UI.search=e.target.value;render();}});
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act],[data-go],[data-play],[data-ans],[data-win],[data-reset],[data-qp],[data-vp]");if(!t)return;const d=t.dataset;
  if(d.vp!==undefined){UI.vp=+d.vp;render();window.scrollTo(0,0);return;}
  if(d.go){UI.tab=d.go;UI.vp=null;UI.menu=false;render();window.scrollTo(0,0);return;}
  if(d.qp!==undefined){UI.qp=+d.qp;UI.editQ=null;render();return;}
  if(d.act==="menu"){UI.menu=!UI.menu;render();return;}
  if(d.act==="enter")return doEnter();
  if(d.act==="forgot")return doForgot();
  if(d.act==="eye"){const i=$("lpw");i.type=i.type==="password"?"text":"password";return;}
    if(d.act==="exit"){if(sb&&session)sb.auth.signOut();session=null;localAdmin=false;try{localStorage.removeItem("ramonte_admin");}catch(e){}UI.landing=true;UI.menu=false;render();return;}
  if(d.act==="login")return doLogin();
  if(d.act==="logout")return doLogout();
  if(d.act==="chpw")return doChangePw();
  if(!A())return;
  const i=+d.i;
  if(d.play!==undefined)return startMatch(+d.play);
  if(d.ans!==undefined)return answer(+d.ans);
  if(d.win!==undefined){const m=S.matches[S.phase][+d.win];m.w=d.s==="a"?m.a:m.b;m.done=true;S.cur=null;return commit();}
  if(d.reset!==undefined){const k=+d.reset,m=S.matches[S.phase][k];m.sa=m.sb=0;m.done=false;m.w=null;S.log=S.log.filter(l=>!(l.p===S.phase&&l.mi===k));return commit();}
  switch(d.act){
    case "draw":draw();break;
    case "vpclose":UI.vp=null;render();break;
    case "back":{if(!(S.hist||[]).length)break;if(!confirm("Revenir à la phase précédente ? Les matchs de la phase actuelle seront effacés."))break;clearInterval(tmr);prevPhase();UI.tab="tirage";commit();toast("Retour à la phase précédente");break;}
    case "next":nextPhase();UI.tab=S.final?"classement":"tirage";render();break;
    case "nextq":nextQ();break;
    case "pause":paused=!paused;render();break;
    case "quit":clearInterval(tmr);S.cur=null;UI.tab="tirage";commit();break;
    case "addc":UI.addC=!UI.addC;render();break;
    case "savenew":{const v=$("newc").value.trim();if(S.names.length>=32){toast("Maximum 32 candidats");break;}if(v){S.names.push(v);UI.addC=false;commit();toast("Candidat ajouté");}break;}
    case "editc":UI.editC=i;render();break;
    case "savec":{const v=$("ec").value.trim();if(v)S.names[i]=v;UI.editC=null;commit();break;}
    case "delc":S.names.splice(i,1);commit();break;
    case "bulk":{const ls=$("bulk").value.split("\n").map(s=>s.trim()).filter(Boolean).slice(0,Math.max(0,32-S.names.length));S.names.push(...ls);commit();toast(ls.length+" ajouté(s)");break;}
    case "addq":UI.editQ={i:-1};render();break;
    case "ch1":{const bank=S.banks[UI.qp];let n=0;CH1.forEach(r=>{if(!bank.some(x=>x.q===r[0])){bank.push({q:r[0],a:r[1],b:r[2],c:r[3]==="B"?1:0});n++;}});commit();toast(n?n+" question(s) ajoutée(s)":"Déjà ajoutées");break;}
    case "editq":UI.editQ={i};render();break;
    case "cancelq":UI.editQ=null;render();break;
    case "saveq":{const o={q:$("fq").value.trim(),a:$("fa").value.trim(),b:$("fb").value.trim(),c:+$("fc").value};
      if(!o.q||!o.a||!o.b){toast("Remplissez la question et les deux réponses.");break;}
      if(UI.editQ.i===-1)S.banks[UI.qp].push(o);else S.banks[UI.qp][UI.editQ.i]=o;S.used[UI.qp]=[];UI.editQ=null;commit();toast("Question enregistrée");break;}
    case "delq":S.banks[UI.qp].splice(i,1);S.used[UI.qp]=[];commit();break;
    case "saveset":S.set={secs:Math.max(5,+$("secs").value||15),qpm:Math.max(2,+$("qpm").value||6),pts:PH.map((_,k)=>+$("pt"+k).value||10)};commit();toast("Réglages enregistrés");break;
    case "rt":if(UI.arm!=="rt"){UI.arm="rt";render();setTimeout(()=>{UI.arm=null;render();},4000);}else{UI.arm=null;const n=S.names,b=S.banks,s=S.set,p=S.pin;S=Object.assign(fresh(),{names:n,banks:b,set:s,pin:p});clearInterval(tmr);UI.tab="dash";commit();}break;
    case "ra":if(UI.arm!=="ra"){UI.arm="ra";render();setTimeout(()=>{UI.arm=null;render();},4000);}else{UI.arm=null;const p=S.pin;S=Object.assign(fresh(),{pin:p});clearInterval(tmr);UI.tab="dash";commit();}break;
    case "copy":try{navigator.clipboard.writeText(report()).then(()=>toast("Rapport copié"),()=>toast("Copie refusée"));}catch(x){toast("Copie impossible");}break;
  }
});
initLanding();
render();
boot();
</script>
</body>
</html>
